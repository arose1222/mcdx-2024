<template>
    <lightning-card title="Egg Manager" icon-name="standard:product">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </template>
        <div class="slds-p-around_medium">

            <!-- Order Name (required) -->
            <lightning-input
                type="text"
                name="orderName"
                label="Order Name"
                value={orderName}
                required
                onchange={handleOrderNameChange}
                class="slds-m-bottom_small">
            </lightning-input>

            <!-- Egg Type -->
            <lightning-combobox
                label="Egg Type"
                value={selectedEggType}
                options={eggTypeOptions}
                onchange={handleTypeChange}
                placeholder="Select Egg Type"
                required
                class="slds-m-bottom_small">
            </lightning-combobox>

            <!-- Egg Size -->
            <div class="slds-m-top_small">
                <lightning-combobox
                    label="Egg Size"
                    value={selectedEggSize}
                    options={eggSizeOptions}
                    onchange={handleSizeChange}
                    placeholder="Select Egg Size"
                    required>
                </lightning-combobox>
            </div>

            <!-- Delivery Date -->
            <lightning-input
                type="date"
                name="deliveryDate"
                label="Delivery Date"
                value={deliveryDate}
                onchange={handleDeliveryDateChange}
                class="slds-m-top_small slds-m-bottom_small">
            </lightning-input>

            <!-- Dozens Requested -->
            <lightning-input
                type="number"
                name="dozensRequested"
                label="Dozens Requested"
                value={dozensRequested}
                min="1"
                step="1"
                onchange={handleDozensRequestedChange}
                class="slds-m-bottom_medium">
            </lightning-input>

            <!-- Inline error -->
            <template if:true={errorMessage}>
                <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert">
                    <lightning-icon icon-name="utility:error" alternative-text="error" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                    <h2>{errorMessage}</h2>
                </div>
            </template>

            <div class="slds-m-top_medium">
                <lightning-button
                    label="Save"
                    variant="brand"
                    onclick={handleSave}
                    disabled={isSaving}
                    class="slds-m-right_small">
                </lightning-button>
                <lightning-button
                    label="Reset"
                    variant="neutral"
                    onclick={handleReset}>
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
