<template>
    <lightning-card title="Egg Entry Form" icon-name="standard:product">
        <div class="slds-p-around_medium">
            <lightning-combobox
                name="eggType"
                label="Egg Type"
                placeholder="Select Egg Type"
                value={eggType}
                options={eggTypeOptions}
                required
                onchange={handleEggTypeChange}
                class="slds-m-bottom_small">
            </lightning-combobox>
            <lightning-combobox
                name="eggSize"
                label="Egg Size"
                placeholder="Select Egg Size"
                value={eggSize}
                options={eggSizeOptions}
                required
                onchange={handleEggSizeChange}
                class="slds-m-bottom_small">
            </lightning-combobox>
            <lightning-input
                type="date"
                name="dateCollected"
                label="Date Collected"
                value={dateCollected}
                onchange={handleDateChange}
                class="slds-m-bottom_small">
            </lightning-input>
            <lightning-textarea
                name="description"
                label="Description"
                placeholder="Enter optional description..."
                value={description}
                onchange={handleDescriptionChange}
                class="slds-m-bottom_medium">
            </lightning-textarea>
            <template if:true={errorMessage}>
                <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert">
                    <lightning-icon icon-name="utility:error" alternative-text="error" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                    <h2>{errorMessage}</h2>
                </div>
            </template>
            <div class="slds-grid slds-gutters slds-m-top_small">
                <div class="slds-col">
                    <lightning-button variant="brand" label="Save" onclick={handleSave} disabled={isSaving}></lightning-button>
                    <lightning-button variant="neutral" label="Reset" onclick={handleReset} disabled={isSaving} class="slds-m-left_small"></lightning-button>
                </div>
            </div>
            <template if:true={isSaving}>
                <lightning-spinner alternative-text="Saving..." size="small"></lightning-spinner>
            </template>
        </div>
    </lightning-card>
</template>
